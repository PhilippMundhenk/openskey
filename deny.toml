# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# openskey has no dependencies on purpose; this keeps it that way and checks
# advisories, licenses and sources for anything that is ever added.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
