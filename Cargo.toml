[package]
name = "openskey"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An open, leak-free reimplementation of Brother's brscan-skey Scan-to-PC key daemon"
license = "MIT"
repository = "https://github.com/PhilippMundhenk/openskey"
readme = "README.md"

# Zero runtime dependencies on purpose: the whole SNMPv1/BER encoding and the
# UDP handling are implemented here, so the daemon builds offline and we own
# every socket's lifetime (the original leaks one per registration, see the
# BrotherScannerDocker issues #179/#186).

[lib]
name = "openskey"
path = "src/lib.rs"

[[bin]]
name = "openskey"
path = "src/main.rs"

[[bin]]
name = "mock-device"
path = "src/bin/mock_device.rs"

[profile.release]
lto = true
strip = true

# Every lint group below is enforced by CI (`cargo clippy -- -D warnings`).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Duration::from_mins and friends need a newer Rust than the MSRV (1.75).
duration_suboptimal_units = "allow"
