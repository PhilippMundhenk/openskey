[package]
name = "openskey"
version = "1.2.0"
edition = "2021"
rust-version = "1.75"
description = "An open, leak-free reimplementation of Brother's brscan-skey Scan-to-PC key daemon"
license = "MIT"
repository = "https://github.com/PhilippMundhenk/openskey"
readme = "README.md"

# Zero runtime dependencies on purpose: the whole SNMPv1/BER encoding and the
# UDP handling are implemented here, so the daemon builds offline and we own
# every socket's lifetime (the original leaks one per registration, see the
# BrotherScannerDocker issues #179/#186).

[lib]
name = "openskey"
path = "src/lib.rs"

[[bin]]
name = "openskey"
path = "src/main.rs"

[[bin]]
name = "mock-device"
path = "src/bin/mock_device.rs"

# Debian package (cargo deb), built by the release workflow for each
# architecture. The service is installed but neither enabled nor started:
# /etc/openskey/openskey.env needs the scanner and host addresses first.
[package.metadata.deb]
maintainer = "Philipp Mundhenk <philipp@mundhenk.org>"
copyright = "Philipp Mundhenk"
section = "net"
priority = "optional"
depends = "systemd | systemd-standalone-sysusers"
extended-description = """\
Registers this host with a Brother multifunction device as a Scan-to-PC \
destination, keeps the registration alive, receives the front-panel button \
presses and runs a scan command for each. An open replacement for Brother's \
brscan-skey daemon, without its socket leak. Also reports the scanner's state \
over SNMP (openskey status) and checks the registration (openskey selftest)."""
assets = [
    ["target/release/openskey", "usr/bin/", "755"],
    ["target/release/mock-device", "usr/bin/openskey-mock-device", "755"],
    ["packaging/openskey.env", "etc/openskey/openskey.env", "640"],
    ["README.md", "usr/share/doc/openskey/README.md", "644"],
    ["PROTOCOL.md", "usr/share/doc/openskey/PROTOCOL.md", "644"],
]
conf-files = ["/etc/openskey/openskey.env"]
maintainer-scripts = "packaging/debian/"
systemd-units = { unit-name = "openskey", unit-scripts = "packaging/", enable = false, start = false }

[profile.release]
lto = true
strip = true

# Every lint group below is enforced by CI (`cargo clippy -- -D warnings`).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Duration::from_mins and friends need a newer Rust than the MSRV (1.75).
duration_suboptimal_units = "allow"
