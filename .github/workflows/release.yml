name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build and publish the Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Package
        id: package
        run: |
          set -euo pipefail
          ref='${{ github.ref_name }}'
          name="openskey-${ref}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/openskey target/release/mock-device "dist/$name/"
          cp README.md PROTOCOL.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openskey-x86_64-linux
          path: ${{ steps.package.outputs.archive }}

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true
